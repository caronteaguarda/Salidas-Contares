<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú Principal</title>

<style>
/* RESET BÁSICO */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
  background:#f5f7fb;
  color:#0b1220;
}

/* CONTENEDOR PRINCIPAL */
.menu{
  padding:6vw;                 /* ESCALA CON LA PANTALLA */
  max-width:100%;
}

/* TÍTULO */
h1{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2rem);
  margin-bottom:6vw;
}

/* BOTONES */
button{
  width:100%;
  padding:4vw;                 /* CLAVE */
  margin-bottom:4vw;
  border-radius:12px;
  border:0;
  background:#0ea5a4;
  color:white;
  font-size:clamp(1.1rem, 4.5vw, 1.4rem);
  cursor:pointer;
}

button.secondary{ background:#6366f1; }
button.third{ background:#64748b; }
button.fourth{ background:#f59e0b; }

button:active{
  transform:scale(0.98);
}
</style>
</head>

<body>

<div class="menu">
  <h1>Aureliano Ferrero</h1>

  <button onclick="location.href='lista.html'">Lista compra</button>
  <button class="secondary" onclick="location.href='pagina1.html'">Contares</button>
  <button class="third" onclick="location.href='salidas.html'">Salidas</button>
  <button class="fourth" onclick="location.href='tension.html'">Tensión</button>
</div>

</body>
</html>
