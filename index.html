<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú Principal</title>

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
  margin:0;
  padding:20px;
  background:#f5f7fb;
  color:#0b1220;
  text-align:center;
}

.menu{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(12,20,40,0.08);
  max-width:360px;
  margin:40px auto;   /* CENTRADO NATURAL */
}

h1{
  margin:0 0 20px;
  font-size:1.4em;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border-radius:10px;
  border:0;
  background:#0ea5a4;
  color:white;
  font-size:1.1em;
  cursor:pointer;
}

button.secondary{ background:#6366f1; }
button.third{ background:#64748b; }
button.fourth{ background:#f59e0b; }

button:hover{ opacity:0.9; }
</style>
</head>

<body>

<div class="menu">
  <h1>Menú Principal</h1>

  <button onclick="location.href='lista.html'">Lista compra</button>
  <button class="secondary" onclick="location.href='pagina1.html'">Contares</button>
  <button class="third" onclick="location.href='salidas.html'">Salidas</button>
  <button class="fourth" onclick="location.href='tension.html'">Tensión</button>
</div>

</body>
</html>
