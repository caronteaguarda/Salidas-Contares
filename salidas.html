<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salidas Furgo</title>
<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="card">
  <h1>Lista Furgo</h1>

  <button class="secondary" onclick="location.href='index.html'">⬅ Volver al menú</button>

  <ul id="myList" class="list"></ul>

  <input type="text" id="newItem" placeholder="Nuevo elemento…">
  <button id="addItem">Agregar</button>

  <button id="toggleMissing">Mostrar faltantes</button>
  <button id="clearSelections">Borrar selecciones</button>
  <button id="resetList" class="secondary">Resetear lista</button>

  <div id="missingPanel"></div>
</div>

<script>
const STORAGE_KEY = 'listaItems2';

const defaultItems = [
  "Cubo África","Menaje cocina","Bombona gas","Agua","Colchonetas","Almohadas","Funda almohadas",
  "Sábana bajera","Sábana superior","Manta","LuluCaravaca","Comida","Water","Infusiones","Leche",
  "Cocina","Rollo papel","Bolsa basura","Toalla","Cepillos dientes","Pasta de dientes",
  "Altavoz Bluetooth","Paño cocina","Aceite","Vinagre","Proyector","Calzado",
  "Protección solar","Antimosquitos","Sillas","Respirador","Pastillas medicina"
].map(label => ({ label, selected:false }));

let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [...defaultItems];

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  updateMissingPanel();
}

const list = document.getElementById("myList");
const input = document.getElementById("newItem");
const missingPanel = document.getElementById("missingPanel");

function render(){
  list.innerHTML="";
  items.forEach(item=>{
    const li=document.createElement("li");
    li.className="item";
    li.innerHTML=`
      <span class="checkbox ${item.selected?'checked':''}">
        ${item.selected?'✓':''}
      </span>
      <span class="label">${item.label}</span>
    `;
    li.onclick=()=>{
      item.selected=!item.selected;
      save(); render();
    };
    list.appendChild(li);
  });
  updateMissingPanel();
}

function updateMissingPanel(){
  if(missingPanel.style.display==="block"){
    const missing=items.filter(i=>!i.selected);
    missingPanel.innerHTML = missing.length
      ? "<strong>Faltan:</strong><ul>"+missing.map(m=>`<li>${m.label}</li>`).join("")+"</ul>"
      : "<strong>Todo listo ✅</strong>";
  }
}

document.getElementById("toggleMissing").onclick=()=>{
  missingPanel.style.display =
    missingPanel.style.display==="block" ? "none" : "block";
  updateMissingPanel();
};

document.getElementById("clearSelections").onclick=()=>{
  items.forEach(i=>i.selected=false);
  save(); render();
};

document.getElementById("resetList").onclick=()=>{
  items=[...defaultItems];
  save(); render();
};

document.getElementById("addItem").onclick=()=>{
  if(!input.value.trim()) return;
  items.push({ label:input.value.trim(), selected:false });
  input.value="";
  save(); render();
};

input.onkeydown=e=>{ if(e.key==="Enter") document.getElementById("addItem").click(); };

render();
</script>

</body>
</html>
