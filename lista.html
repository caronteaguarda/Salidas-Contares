<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de compra</title>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
  background:#f5f7fb;
  color:#0b1220;
}

/* CONTENEDOR PRINCIPAL */
.card{
  padding:6vw;
}

/* TÍTULO */
h1{
  text-align:center;
  font-size:clamp(1.5rem, 5.5vw, 2rem);
  margin-bottom:4vw;
}

/* LISTA */
ul.list{
  list-style:none;
  padding:0;
  margin:0 0 4vw;
  display:grid;
  gap:3vw;
}

/* ITEM */
li.item{
  display:flex;
  align-items:center;
  gap:4vw;
  padding:4vw;
  border-radius:12px;
  background:#fff;
  box-shadow:0 4px 10px rgba(12,20,40,0.08);
  cursor:pointer;
}

/* CHECK */
.checkbox{
  width:7vw;
  height:7vw;
  max-width:32px;
  max-height:32px;
  border-radius:6px;
  border:2px solid #0ea5a4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(1.2rem, 4vw, 1.5rem);
}

.checkbox.checked{
  background:#0ea5a4;
  color:#fff;
}

/* TEXTO */
.label{
  flex:1;
  font-size:clamp(1.2rem, 4.5vw, 1.5rem);
}

/* ZONAS DE BOTONES */
.actions,
.add-container{
  display:flex;
  flex-direction:column;
  gap:3vw;
  margin-top:4vw;
}

/* INPUT */
input{
  padding:4vw;
  border-radius:12px;
  border:2px solid #cbd5e1;
  font-size:clamp(1.2rem, 4.5vw, 1.5rem);
}

/* BOTONES */
button{
  padding:4vw;
  border-radius:14px;
  border:0;
  background:#0ea5a4;
  color:white;
  font-size:clamp(1.3rem, 5vw, 1.6rem);
  font-weight:600;
  cursor:pointer;
}

button.secondary{ background:#64748b; }

button:active{
  transform:scale(0.97);
}

/* PANEL FALTANTES */
#missingPanel{
  margin-top:4vw;
  padding:4vw;
  border-radius:12px;
  background:#fff;
  box-shadow:0 4px 10px rgba(12,20,40,0.08);
  font-size:clamp(1.1rem, 4vw, 1.4rem);
  display:none;
}
</style>
</head>

<body>

<div class="card">
  <h1>Lista de compra</h1>

  <button id="goBack" class="secondary">⬅ Volver al menú</button>

  <ul id="myList" class="list"></ul>

  <div class="add-container">
    <input type="text" id="newItem" placeholder="Nuevo producto…">
    <button id="addItem">Agregar</button>
  </div>

  <div class="actions">
    <button id="toggleMissing">Mostrar faltantes</button>
    <button id="clearSelections">Borrar selecciones</button>
    <button id="resetList" class="secondary">Resetear lista</button>
  </div>

  <div id="missingPanel"></div>
</div>

<script>
const STORAGE_KEY="listaCompra";
let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

items = items.map(i => ({
  label: i.label || i.value || "Elemento",
  value: i.value || (i.label || "").toLowerCase().replace(/\s+/g,'_'),
  selected: !!i.selected
}));

const save = () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  updateMissingPanel();
};

const list=document.getElementById("myList");
const addBtn=document.getElementById("addItem");
const input=document.getElementById("newItem");
const clearBtn=document.getElementById("clearSelections");
const resetBtn=document.getElementById("resetList");
const toggleMissingBtn=document.getElementById("toggleMissing");
const missingPanel=document.getElementById("missingPanel");
const goBack=document.getElementById("goBack");

goBack.onclick = () => location.href="index.html";

function render(){
 list.innerHTML="";
 items.forEach(item=>{
  const li=document.createElement("li");
  li.className="item";
  li.innerHTML=`
    <span class="checkbox ${item.selected?'checked':''}">
      ${item.selected?'✓':''}
    </span>
    <span class="label">${item.label}</span>
  `;
  li.onclick=()=>{
    item.selected=!item.selected;
    save(); render();
  };
  list.appendChild(li);
 });
 updateMissingPanel();
}

function updateMissingPanel(){
  if (missingPanel.style.display === "block") {
    const missing = items.filter(i => !i.selected);
    missingPanel.innerHTML = missing.length
      ? "<strong>Faltan por comprar:</strong><ul>" + missing.map(m => `<li>${m.label}</li>`).join("") + "</ul>"
      : "<strong>Todo está comprado ✅</strong>";
  }
}

toggleMissingBtn.onclick = () => {
  missingPanel.style.display =
    (missingPanel.style.display === "block") ? "none" : "block";
  if (missingPanel.style.display === "block") updateMissingPanel();
};

clearBtn.onclick=()=>{items.forEach(i=>i.selected=false);save();render();};

resetBtn.onclick=()=>{
  localStorage.removeItem(STORAGE_KEY);
  items=[];render();updateMissingPanel();
};

addBtn.onclick=()=>{
 if(!input.value.trim())return;
 items.push({
   label:input.value.trim(),
   value:input.value.trim().toLowerCase().replace(/\s+/g,'_'),
   selected:false
 });
 input.value=""; save(); render();
};
input.onkeydown=e=>{if(e.key==="Enter")addBtn.click();};

render();
</script>

</body>
</html>
