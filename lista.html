<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de compra</title>

<style>
:root{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
}

body{
  background:#f5f7fb;
  color:#0b1220;
  padding:32px;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* TARJETA */
.card{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(12,20,40,0.08);
  max-width:420px;
  width:100%;
}

/* TÍTULO */
h1{
  margin:0 0 16px;
  text-align:center;
  font-size:22px;
}

/* LISTA */
ul.list{
  list-style:none;
  padding:0;
  margin:16px 0;
  display:grid;
  gap:12px;
}

li.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  cursor:pointer;
}

/* CHECK */
.checkbox{
  width:26px;
  height:26px;
  border-radius:6px;
  border:2px solid #0ea5a4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.checkbox.checked{
  background:#0ea5a4;
  color:#fff;
}

/* TEXTO */
.label{
  flex:1;
  font-size:16px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:16px;
}

/* BOTONES */
button{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:0;
  background:#0ea5a4;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

button.secondary{ background:#64748b; }
button:hover{ opacity:0.9; }

/* PANELES */
#missingPanel{
  margin-top:16px;
  padding:14px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  display:none;
}
</style>
</head>

<body>

<div class="card">
  <h1>Lista de compra</h1>

  <button class="secondary" onclick="location.href='index.html'">⬅ Volver al menú</button>

  <ul id="myList" class="list"></ul>

  <input type="text" id="newItem" placeholder="Nuevo producto…">
  <button id="addItem">Agregar</button>

  <button id="toggleMissing">Mostrar faltantes</button>
  <button id="clearSelections">Borrar selecciones</button>
  <button id="resetList" class="secondary">Resetear lista</button>

  <div id="missingPanel"></div>
</div>

<script>
const STORAGE_KEY="listaCompra";
let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

items = items.map(i => ({
  label: i.label || i.value || "Elemento",
  selected: !!i.selected
}));

const save = () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  updateMissingPanel();
};

const list=document.getElementById("myList");
const addBtn=document.getElementById("addItem");
const input=document.getElementById("newItem");
const clearBtn=document.getElementById("clearSelections");
const resetBtn=document.getElementById("resetList");
const toggleMissingBtn=document.getElementById("toggleMissing");
const missingPanel=document.getElementById("missingPanel");

function render(){
 list.innerHTML="";
 items.forEach(item=>{
  const li=document.createElement("li");
  li.className="item";
  li.innerHTML=`
    <span class="checkbox ${item.selected?'checked':''}">
      ${item.selected?'✓':''}
    </span>
    <span class="label">${item.label}</span>
  `;
  li.onclick=()=>{
    item.selected=!item.selected;
    save(); render();
  };
  list.appendChild(li);
 });
 updateMissingPanel();
}

function updateMissingPanel(){
  if (missingPanel.style.display === "block") {
    const missing = items.filter(i => !i.selected);
    missingPanel.innerHTML = missing.length
      ? "<strong>Faltan por comprar:</strong><ul>" + missing.map(m => `<li>${m.label}</li>`).join("") + "</ul>"
      : "<strong>Todo está comprado ✅</strong>";
  }
}

toggleMissingBtn.onclick=()=>{
  missingPanel.style.display =
    missingPanel.style.display==="block"?"none":"block";
  updateMissingPanel();
};

clearBtn.onclick=()=>{items.forEach(i=>i.selected=false);save();render();};

resetBtn.onclick=()=>{
  localStorage.removeItem(STORAGE_KEY);
  items=[];render();
};

addBtn.onclick=()=>{
 if(!input.value.trim())return;
 items.push({ label:input.value.trim(), selected:false });
 input.value=""; save(); render();
};

input.onkeydown=e=>{if(e.key==="Enter")addBtn.click();};

render();
</script>

</body>
</html>
