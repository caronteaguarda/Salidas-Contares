<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tensión</title>
<style>
*{box-sizing:border-box;}
body{
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  background:#fff;
  padding:6vw;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(12,20,40,0.08);
  max-width:360px;
  width:90%;
}

/* TITULO */
h1{
  margin-top:0;
  text-align:center;
  font-size:clamp(1.6rem,6vw,2rem);
}

/* LABELS */
label{
  display:block;
  margin-top:4vw;
  font-weight:600;
  font-size:clamp(1.2rem,4vw,1.4rem);
}

/* INPUTS Y SELECT */
input, select{
  width:100%;
  padding:4vw;
  margin-top:2vw;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:clamp(1.2rem,4vw,1.4rem);
}

/* BOTONES */
button{
  margin-top:4vw;
  width:100%;
  padding:4vw;
  border:0;
  border-radius:12px;
  background:#0ea5a4;
  color:white;
  font-size:clamp(1.3rem,4.5vw,1.6rem);
  font-weight:600;
  cursor:pointer;
  transition:transform 0.1s ease;
}

button:hover{ opacity:0.9; }
button:active{ transform:scale(0.97); }

button.back{
  background:#64748b;
}
</style>
</head>
<body>

<div class="card">
  <h1>Tensión</h1>

  <label for="zona">Zona</label>
  <select id="zona">
    <option value="Chiclana">Chiclana</option>
    <option value="La Isla">La Isla</option>
    <option value="Alcalá">Alcalá</option>
    <option value="San Pedro">San Pedro</option>
  </select>

  <label for="enalapril">Enalapril</label>
  <input type="text" id="enalapril">

  <label for="aas">AAS</label>
  <input type="text" id="aas">

  <button onclick="guardarDatos()">Guardar</button>
  <button class="back" onclick="location.href='index.html'">Volver al menú</button>
</div>

<script>
// Base de datos inicial
const datosPorDefecto = {
  "Chiclana": { enalapril: "", aas: "" },
  "La Isla": { enalapril: "", aas: "" },
  "Alcalá": { enalapril: "", aas: "" },
  "San Pedro": { enalapril: "", aas: "" }
};

// Cargar datos desde localStorage o crearla
function cargarBaseDatos(){
  if(!localStorage.getItem("tensionDB")){
    localStorage.setItem("tensionDB", JSON.stringify(datosPorDefecto));
  }
  return JSON.parse(localStorage.getItem("tensionDB"));
}

let db = cargarBaseDatos();

const zonaSelect = document.getElementById("zona");
const enalaprilInput = document.getElementById("enalapril");
const aasInput = document.getElementById("aas");

// Mostrar datos al cambiar de zona
function mostrarDatos(){
  const zona = zonaSelect.value;
  enalaprilInput.value = db[zona].enalapril;
  aasInput.value = db[zona].aas;
}

// Guardar datos modificados
function guardarDatos(){
  const zona = zonaSelect.value;
  db[zona].enalapril = enalaprilInput.value;
  db[zona].aas = aasInput.value;

  localStorage.setItem("tensionDB", JSON.stringify(db));
  alert("Datos guardados correctamente");
}

zonaSelect.addEventListener("change", mostrarDatos);
mostrarDatos();

// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("Service Worker registrado"))
    .catch(err => console.log("Error al registrar Service Worker:", err));
}
</script>

</body>
</html>
