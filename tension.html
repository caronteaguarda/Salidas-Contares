<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tensión</title>
<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="card">
  <h1>Tensión</h1>

  <label for="zona">Zona</label>
  <select id="zona">
    <option value="Chiclana">Chiclana</option>
    <option value="La Isla">La Isla</option>
    <option value="Alcalá">Alcalá</option>
    <option value="San Pedro">San Pedro</option>
  </select>

  <label for="enalapril">Enalapril</label>
  <input type="text" id="enalapril">

  <label for="aas">AAS</label>
  <input type="text" id="aas">

  <button onclick="guardarDatos()">Guardar</button>
  <button class="back" onclick="location.href='index.html'">Volver al menú</button>
</div>

<script>
// Base de datos inicial
const datosPorDefecto = {
  "Chiclana": { enalapril: "", aas: "" },
  "La Isla": { enalapril: "", aas: "" },
  "Alcalá": { enalapril: "", aas: "" },
  "San Pedro": { enalapril: "", aas: "" }
};

// Cargar datos desde localStorage o crearla
function cargarBaseDatos(){
  if(!localStorage.getItem("tensionDB")){
    localStorage.setItem("tensionDB", JSON.stringify(datosPorDefecto));
  }
  return JSON.parse(localStorage.getItem("tensionDB"));
}

let db = cargarBaseDatos();

const zonaSelect = document.getElementById("zona");
const enalaprilInput = document.getElementById("enalapril");
const aasInput = document.getElementById("aas");

// Mostrar datos al cambiar de zona
function mostrarDatos(){
  const zona = zonaSelect.value;
  enalaprilInput.value = db[zona].enalapril;
  aasInput.value = db[zona].aas;
}

// Guardar datos modificados
function guardarDatos(){
  const zona = zonaSelect.value;
  db[zona].enalapril = enalaprilInput.value;
  db[zona].aas = aasInput.value;

  localStorage.setItem("tensionDB", JSON.stringify(db));
  alert("Datos guardados correctamente");
}

zonaSelect.addEventListener("change", mostrarDatos);

// Mostrar datos iniciales
mostrarDatos();
</script>

</body>
</html>
