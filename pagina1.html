<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contares Lista</title>

<style>
:root{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
}

body{
  background:#f5f7fb;
  color:#0b1220;
  padding:32px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  margin:0;
}

/* TARJETA */
.card{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(12,20,40,0.08);
  max-width:440px;
  width:100%;
}

/* TÍTULO */
h1{
  margin:0 0 8px;
  text-align:center;
  font-size:22px;
}

p.lead{
  text-align:center;
  margin:0 0 16px;
  color:#475569;
  font-size:15px;
}

/* LISTA */
ul.list{
  list-style:none;
  padding:0;
  margin:16px 0;
  display:grid;
  gap:12px;
}

li.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  cursor:pointer;
}

/* CHECK */
.checkbox{
  width:26px;
  height:26px;
  border-radius:6px;
  border:2px solid #6366f1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.checkbox.checked{
  background:#6366f1;
  color:#fff;
}

/* TEXTO */
.label{
  flex:1;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:16px;
}

/* BOTONES */
button{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:0;
  background:#0ea5a4;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

button.secondary{ background:#64748b; }
button:hover{ opacity:0.9; }

/* PANEL FALTANTES */
#missingPanel{
  margin-top:16px;
  padding:14px;
  border-radius:12px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  display:none;
}
</style>
</head>

<body>

<div class="card">
  <h1>Contares Lista</h1>
  <p class="lead">Selecciona, agrega y guarda automáticamente.</p>

  <button class="secondary" onclick="location.href='index.html'">⬅ Volver al menú</button>

  <ul id="myList" class="list"></ul>

  <input type="text" id="newItem" placeholder="Nuevo elemento…">
  <button id="addItem">Agregar</button>

  <button id="toggleMissing">Mostrar faltantes</button>
  <button id="clearSelections">Borrar selecciones</button>
  <button id="resetList" class="secondary">Resetear lista</button>

  <div id="missingPanel"></div>
</div>

<script>
const STORAGE_KEY = 'listaItems1';

const defaultItems = [
  "Altavoz 1","Pie Altavoz 1","Cable alimentación altavoz 1","Cable mesa Altavoz 1",
  "Altavoz 2","Pie Altavoz 2","Cable alimentación altavoz 2","Cable mesa Altavoz 2",
  "Altavoz 3","Pie Altavoz 3","Cable alimentación altavoz 3","Cable mesa Altavoz 3",
  "Ordenador","Cargador ordenador","Ratón ordenador","Proyector","Cable alimentación proyector","Cable HDMI proyector","Pie proyector","Pantalla proyector",
  "Saxo alto","Saxo soprano","Micro saxo inalámbrico","Petaca micro","Pilas petaca","Receptor micro inalámbrico","Alimentador receptor micro","Cable receptor-mesa",
  "Voice live","Alimentador voice","Cable mesa-voice",
  "Piano","Pedal piano","Alimentador piano","Pie piano","Cable piano-mesa",
  "Minimesa","Alimentador minimesa","Micro Shure","Cable micro Shure","Pie micro",
  "Mesa de mezclas","Cables mesa","Pie de mesa","Cables extra","Micro de diadema",
  "Receptor bluetooth","Alimentador receptor bluetooth","Cable receptor bluetooth-mesa"
].map(label => ({ label, selected:false }));

let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [...defaultItems];

const list = document.getElementById("myList");
const input = document.getElementById("newItem");
const missingPanel = document.getElementById("missingPanel");

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  updateMissingPanel();
}

function render(){
  list.innerHTML="";
  items.forEach(item=>{
    const li=document.createElement("li");
    li.className="item";
    li.innerHTML=`
      <span class="checkbox ${item.selected?'checked':''}">
        ${item.selected?'✓':''}
      </span>
      <span class="label">${item.label}</span>
    `;
    li.onclick=()=>{
      item.selected=!item.selected;
      save(); render();
    };
    list.appendChild(li);
  });
  updateMissingPanel();
}

function updateMissingPanel(){
  if(missingPanel.style.display==="block"){
    const missing=items.filter(i=>!i.selected);
    missingPanel.innerHTML = missing.length
      ? "<strong>Faltan por seleccionar:</strong><ul>"+missing.map(m=>`<li>${m.label}</li>`).join("")+"</ul>"
      : "<strong>Todos los elementos están seleccionados ✅</strong>";
  }
}

document.getElementById("toggleMissing").onclick=()=>{
  missingPanel.style.display =
    missingPanel.style.display==="block" ? "none" : "block";
  updateMissingPanel();
};

document.getElementById("clearSelections").onclick=()=>{
  items.forEach(i=>i.selected=false);
  save(); render();
};

document.getElementById("resetList").onclick=()=>{
  items=[...defaultItems];
  save(); render();
};

document.getElementById("addItem").onclick=()=>{
  if(!input.value.trim()) return;
  items.push({ label:input.value.trim(), selected:false });
  input.value="";
  save(); render();
};

input.onkeydown=e=>{ if(e.key==="Enter") document.getElementById("addItem").click(); };

render();
</script>

</body>
</html>
