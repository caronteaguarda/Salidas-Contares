<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contares Lista</title>
<style>
*{box-sizing:border-box;}

body{
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
  background:#f5f7fb;
  color:#0b1220;
}

/* CONTENEDOR PRINCIPAL */
.card{
  padding:6vw;
}

/* TÍTULO Y TEXTO */
h1{
  text-align:center;
  font-size:clamp(1.5rem, 5.5vw, 2rem);
  margin-bottom:3vw;
}

p.lead{
  text-align:center;
  font-size:clamp(1rem,4vw,1.3rem);
  margin-bottom:4vw;
  color:#475569;
}

/* LISTA */
ul.list{
  list-style:none;
  padding:0;
  margin:0 0 4vw;
  display:grid;
  gap:3vw;
}

/* ITEM */
li.item{
  display:flex;
  align-items:center;
  gap:4vw;
  padding:4vw;
  border-radius:12px;
  background:#fff;
  box-shadow:0 4px 10px rgba(12,20,40,0.08);
  cursor:pointer;
}

/* CHECK */
.checkbox{
  width:7vw;
  height:7vw;
  max-width:32px;
  max-height:32px;
  border-radius:6px;
  border:2px solid #6366f1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(1.2rem, 4vw, 1.5rem);
}

.checkbox.checked{
  background:#6366f1;
  color:#fff;
}

/* TEXTO */
.label{
  flex:1;
  font-size:clamp(1.2rem, 4.5vw, 1.5rem);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* INPUT Y BOTONES */
.add-container,
.actions{
  display:flex;
  flex-direction:column;
  gap:3vw;
  margin-top:4vw;
}

input#newItem{
  padding:4vw;
  border-radius:12px;
  border:2px solid #cbd5e1;
  font-size:clamp(1.2rem,4.5vw,1.5rem);
}

button{
  padding:4vw;
  border-radius:14px;
  border:0;
  background:#0ea5a4;
  color:white;
  font-size:clamp(1.3rem,5vw,1.6rem);
  font-weight:600;
  cursor:pointer;
}

button.secondary{ background:#64748b; }

button:active{ transform:scale(0.97); }

/* PANEL FALTANTES */
#missingPanel{
  margin-top:4vw;
  padding:4vw;
  border-radius:12px;
  background:#fff;
  box-shadow:0 4px 10px rgba(12,20,40,0.08);
  font-size:clamp(1.1rem,4vw,1.4rem);
  display:none;
}
</style>
</head>
<body>

<div class="card">
  <h1>Contares Lista</h1>
  <p class="lead">Selecciona, agrega y guarda automáticamente.</p>

  <button id="goBack" class="secondary">⬅ Volver al menú</button>

  <ul id="myList" class="list" role="listbox" aria-label="Lista A"></ul>

  <div class="add-container">
    <input type="text" id="newItem" placeholder="Nuevo elemento...">
    <button id="addItem">Agregar</button>
  </div>

  <div class="actions">
    <button id="toggleMissing">Mostrar faltantes</button>
    <button id="clearSelections">Borrar selecciones</button>
    <button id="resetList" class="secondary">Resetear lista</button>
  </div>

  <div id="missingPanel" aria-live="polite"></div>
</div>

<script>
const STORAGE_KEY = 'listaItems1';
const list = document.getElementById('myList');
const toggleMissingBtn = document.getElementById('toggleMissing');
const clearBtn = document.getElementById('clearSelections');
const resetBtn = document.getElementById('resetList');
const addBtn = document.getElementById('addItem');
const newItemInput = document.getElementById('newItem');
const missingPanel = document.getElementById('missingPanel');
const goBackBtn = document.getElementById('goBack');

goBackBtn.addEventListener('click', () => { window.location.href = 'index.html'; });

const defaultItems = [
  "Altavoz 1","Pie Altavoz 1","Cable alimentación altavoz 1","Cable mesa Altavoz 1",
  "Altavoz 2","Pie Altavoz 2","Cable alimentación altavoz 2","Cable mesa Altavoz 2",
  "Altavoz 3","Pie Altavoz 3","Cable alimentación altavoz 3","Cable mesa Altavoz 3",
  "Ordenador","cargador ordenador","Ratón ordenador","Proyector","Cable alimentación proyector","cable HDMI proyector","Pie proyector","Pantalla proyector",
  "Saxo alto","Saxo Soprano","Micro saxo inalámbrico","Petaca micro","Pilas petaca","Receptor micro inalámbrico","Alimentador receptor micro","Cable receptor-mesa",
  "Voce live","Alimentador voice","Cable mesa-voice",
  "Piano","Pedal piano","Alimentador piano","Pie piano","Cable piano-mesa",
  "Minimesa","Alimentador minimesa","Micro shure","Cable micro shure","Pie micro",
  "Mesa de mezclas","Cables mesa","Pie de mesa","Cables extra","Micro de diadema",
  "Receptor bluetooth","Alimentador receptor blue","Cable receptor blue-mesa"
].map(label => ({ label, value: label.toLowerCase().replace(/\s+/g,'_'), selected:false }));

let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [...defaultItems];

function saveToLocalStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  updateMissingPanel();
}

function renderList() {
  list.innerHTML = '';
  items.forEach(item => {
    const li = document.createElement('li');
    li.className = 'item';
    li.tabIndex = 0;
    li.dataset.value = item.value;
    li.innerHTML = `<span class="checkbox ${item.selected?'checked':''}">${item.selected?'✓':''}</span><span class="label">${item.label}</span>`;
    li.addEventListener('click', () => {
      item.selected = !item.selected;
      saveToLocalStorage();
      renderList();
    });
    list.appendChild(li);
  });
  updateMissingPanel();
}

function updateMissingPanel() {
  if(missingPanel.style.display==='block'){
    const missing = items.filter(i=>!i.selected);
    missingPanel.innerHTML = missing.length
      ? '<strong>Faltan por seleccionar:</strong><ul>'+missing.map(m=>`<li>${m.label}</li>`).join('')+'</ul>'
      : '<strong>Todos los elementos están seleccionados ✅</strong>';
  }
}

toggleMissingBtn.addEventListener('click',()=>{
  missingPanel.style.display=(missingPanel.style.display==='block')?'none':'block';
  if(missingPanel.style.display==='block') updateMissingPanel();
});

clearBtn.addEventListener('click',()=>{
  items.forEach(i=>i.selected=false);
  saveToLocalStorage();
  renderList();
});

resetBtn.addEventListener('click',()=>{
  items=[...defaultItems];
  saveToLocalStorage();
  renderList();
});

addBtn.addEventListener('click',()=>{
  const value=newItemInput.value.trim();
  if(!value) return;
  items.push({label:value,value:value.toLowerCase().replace(/\s+/g,'_'),selected:false});
  renderList();
  saveToLocalStorage();
  newItemInput.value='';
  newItemInput.focus();
});

newItemInput.addEventListener('keydown', e=>{if(e.key==='Enter') addBtn.click();});

renderList();

// Service Worker
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js").then(()=>console.log("Service Worker registrado"))
  .catch(err=>console.log("Error al registrar Service Worker:",err));
}
</script>
</body>
</html>
